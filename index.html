rde.","Azul/Ámbar.","Ámbar/Verde.","Rojo/Verde."],"answer":"Azul/Verde."},{"id":11,"type":"mcq","question":"Es el significado de las siglas AIP:","options":["Secretaria de Comunicaciones y Transportes.","Additional Attendant Panel.","Agencia Federal de Aviación Civil.","Attendant Indication Panel."],"answer":"Attendant Indication Panel."},{"id":12,"type":"mcq","question":"Es el significado de las siglas AAP:","options":["Additional Attendant Panel.","Agencia Federal de Aviación Civil.","Secretaria de Comunicaciones y Transportes.","Attendant Indication Panel."],"answer":"Additional Attendant Panel."},{"id":13,"type":"mcq","question":"¿Cuáles son los tipos de toboganes del avión Airbus A320?","options":["Tobogán balsa, tobogán escalera y tobogán de evacuación trasero.","Tobogán dispositivo de flotación, tobogán de ala y escalera de emergencia.","Tobogán rampa, tobogán inflable individual y balsa auxiliar.","Tobogán balsa y rampa, o, Tobogán dispositivo de flotación y Tobogán rampa."],"answer":"Tobogán balsa y rampa, o, Tobogán dispositivo de flotación y Tobogán rampa."},{"id":14,"type":"tf","question":"Los aviones de cabina ancha tienen doble pasillo:","options":["Verdadero","Falso"],"answer":"Verdadero"},{"id":15,"type":"mcq","question":"Menciona como se activa el ELT 406SE en tierra y agua:","options":["Manualmente, tierra ARM y agua XMT.","Manualmente, tierra XMT y agua ARM.","Automáticamente, tierra OFF y agua XMT.","Manualmente, tierra TEST y agua OFF."],"answer":"Manualmente, tierra XMT y agua ARM."},{"id":16,"type":"mcq","question":"¿Cuáles son las 4 constantes o acróstico que se revisan en el equipo de emergencia?","options":["Libre acceso, Operativo, Presente y Asegurado. (LOPA).","Tobogán balsa y rampa, o, Tobogán dispositivo de flotación y Tobogán rampa.","Extintor, Lampara, MRT y Chaleco Salvavidas.","Mascarilla de desconexión rápida(quick donning), Extintor de Halón, Hacha, Salva vidas, Linterna, Guantes de asbesto, PBE."],"answer":"Libre acceso, Operativo, Presente y Asegurado. (LOPA)."},{"id":17,"type":"mcq","question":"¿Cuál es la capacidad del tobogán Balsa?","options":["49-60 pasajeros.","45-56 pasajeros.","43-54 pasajeros.","44-55 pasajeros."],"answer":"44-55 pasajeros."},{"id":18,"type":"mcq","question":"Son los principios en los que se divide el Survival Kit:","options":["Mantenimientos, Supervivencia y Señalización.","Primeros auxilios, Extinción y Flotación.","Protección, Comunicación y Evacuación.","Rescate, Navegación y Abastecimiento."],"answer":"Mantenimientos, Supervivencia y Señalización."},{"id":19,"type":"mcq","question":"Menciona que le revisas, color de indicador y duración de la PBE “Drager”:","options":["Constante LOPA, indicador sello color amarillo y tiene una duración de 20min.","Constante LOPA, indicador sello color amarillo y tiene una duración de 21min.","Constante LOPA, indicador sello color amarillo y tiene una duración de 25min.","Constante LOPA, indicador sello color amarillo y tiene una duración de 19min."],"answer":"Constante LOPA, indicador sello color amarillo y tiene una duración de 20min."},{"id":20,"type":"mcq","question":"¿Cuál es la duración del Extintor de Halón debajo del lavamanos del avión Airbus?","options":["2 a 14 segundos.","4 a 16 segundos.","8 a 20 segundos.","3 a 15 segundos."],"answer":"3 a 15 segundos."},{"id":21,"type":"tf","question":"¿La duración de las botellas de oxígeno en HI es de 75 min?","options":["Verdadero","Falso"],"answer":"Verdadero"},{"id":22,"type":"tf","question":"El Hand Set se encuentra en cada estación de sobrecargos:","options":["Verdadero","Falso"],"answer":"Verdadero"},{"id":23,"type":"mcq","question":"Son tres elementos del equipo de emergencia que encontramos en una cabina de pilotos:","options":["Mascarilla de desconexión rápida(quick donning), Extintor de Halón, Hacha, Salva vidas, Linterna, Guantes de asbesto, PBE.","Libre acceso, Operativo, Presente y Asegurado. (LOPA).","Extintor, Lampara, MRT y Chaleco Salvavidas.","Palanca de apertura, Mirilla, Manija de sujeción, Pin de seguridad, Compartimento de resguardo de tobogán."],"answer":"Mascarilla de desconexión rápida(quick donning), Extintor de Halón, Hacha, Salva vidas, Linterna, Guantes de asbesto, PBE."},{"id":24,"type":"mcq","question":"Sirve para romper paneles, mamparos y perforar:","options":["Extintor de Halón.","Barreta de emergencia.","Hacha.","Linterna de emergencia."],"answer":"Hacha."},{"id":25,"type":"mcq","question":"Debe permanecer cerrada y asegurada durante todo el tiempo de vuelo:","options":["Puerta de acceso a la cabina de vuelo.","Puerta del sanitario delantero.","Puerta principal izquierda.","Compartimiento del equipo de emergencia."],"answer":"Puerta de acceso a la cabina de vuelo."},{"id":26,"type":"mcq","question":"Significado de las siglas PSU en inglés:","options":["Passenger Service Unit.","Push to talk.","Attendant Indication Panel.","Additional Attendant Panel."],"answer":"Passenger Service Unit."},{"id":27,"type":"mcq","question":"Elementos que contiene el compartimiento de equipo de emergencia en una estación de sobrecargos:","options":["Libre acceso, Operativo, Presente y Asegurado. (LOPA).","Mascarilla de desconexión rápida(quick donning), Extintor de Halón, Hacha, Salva vidas, Linterna, Guantes de asbesto, PBE.","Extintor, Lampara, MRT y Chaleco Salvavidas.","Luz roja fija."],"answer":"Extintor, Lampara, MRT y Chaleco Salvavidas."},{"id":28,"type":"mcq","question":"Tiene un led rojo para verificar su operatividad, el cual parpadea con un intervalo de 3 a 5 segundos, después de 10 segundos indica que la batería esta baja:","options":["Luz indicadora del chaleco salvavidas.","Lámpara de lectura del pasajero.","Linterna portátil del botiquín.","Lampara Flash Light (Lampara automática de emergencia)."],"answer":"Lampara Flash Light (Lampara automática de emergencia)."},{"id":29,"type":"mcq","question":"En la revisión pre-vuelo debe tener los siguientes elementos: Manómetro en rango verde, Pin de seguridad, libre acceso, operativo, presente, asegurado, su tiempo de descarga es de 10 a 15 segundos:","options":["Botella portátil de Oxígeno (BPO).","Extintor de Halón.","Puerta de acceso a la cabina de vuelo.","PBE AIR LIQUID."],"answer":"Extintor de Halón."},{"id":30,"type":"mcq","question":"Sirve para proteger los ojos, nariz y boca evitando la inhalación de gases tóxicos:","options":["Mascarilla de oxígeno para pasajeros.","Chaleco salvavidas.","Botella portátil de oxígeno.","Mascara contra humo, PBE (Protective Breathing Equipment)."],"answer":"Mascara contra humo, PBE (Protective Breathing Equipment)."},{"id":31,"type":"mcq","question":"Se le revisa indicador de humedad en azul para que este operativo, si se encuentra en color rosa esta inoperativo, su duración es de 15 min, se debe activar antes de ponértela. ¿De que PBE estamos hablando?","options":["PBE DRAGER.","PBE AVOX/SCOTT.","Botella portátil de Oxígeno (BPO).","PBE AIR LIQUID."],"answer":"PBE AVOX/SCOTT."},{"id":32,"type":"mcq","question":"Se le revisa el indicador de humedad en color verde para que este operativo, si se encuentra rojo esta inoperativo, su duración es de 15 min, se activa al ponerla en la cabeza. ¿De que PBE estamos hablando?","options":["PBE AVOX/SCOTT.","PBE DRAGER.","PBE AIR LIQUID.","Botella portátil de Oxígeno (BPO)."],"answer":"PBE AIR LIQUID."},{"id":33,"type":"mcq","question":"Se le revisa indicador o etiqueta amarillo, su duración es de 20 min, se activa después de ponerse. ¿De que PBE estamos hablando?","options":["PBE AVOX/SCOTT.","PBE AIR LIQUID.","PBE DRAGER.","Botella portátil de Oxígeno (BPO)."],"answer":"PBE DRAGER."},{"id":34,"type":"mcq","question":"Transmisor de Localización de Emergencia, es el significado en español de las siglas:","options":["ELT- Emergency Locator Transmitter.","EPT- Emergency Position Transmitter.","ELU- Emergency Lighting Unit.","ECS- Emergency Communication System."],"answer":"ELT- Emergency Locator Transmitter."},{"id":35,"type":"mcq","question":"Significado en ingles de las siglas PPT:","options":["Additional Attendant Panel.","Attendant Indication Panel.","Passenger Service Unit.","Push to talk."],"answer":"Push to talk."},{"id":36,"type":"mcq","question":"Permite la comunicación entre todos los miembros de la tripulación, además ayuda a proporcionar información a la cabina de pasajeros a un volumen adecuado:","options":["Handset.","ACP.","MRT.","FAP."],"answer":"Handset."},{"id":37,"type":"mcq","question":"Si el ACP se ilumina de color rojo, ¿Qué significa?","options":["Llamada de Emergencia.","Llamada desde un baño.","Azul/Verde.","Llamada del capitán o sobrecargo."],"answer":"Llamada del capitán o sobrecargo."},{"id":38,"type":"mcq","question":"Si el ACP se ilumina de color rojo intermitente, ¿Qué significa?","options":["Azul/Verde.","Llamada de Emergencia.","Llamada del capitán o sobrecargo.","Llamada desde un baño."],"answer":"Llamada de Emergencia."},{"id":39,"type":"mcq","question":"Duración de la batería del chaleco Salvavidas:","options":["9 horas aprox. se activa al contacto con el agua.","8 horas aprox. se activa al contacto con el agua.","13 horas aprox. se activa al contacto con el agua.","7 horas aprox. se activa al contacto con el agua."],"answer":"8 horas aprox. se activa al contacto con el agua."},{"id":40,"type":"mcq","question":"En caso de presentarse humo en sanitario se activarán las alarmas visuales. ¿En dónde habrá indicaciones?","options":["FAP (Botón de Smoke Reset se encenderá). AIP (Led color rojo intermitente). ACP (Led color verde intermitente). Afuera del baño (Luz verde).","FAP (Botón de Smoke Reset se encenderá). AIP (Led color rojo intermitente). ACP (Led color ámbar intermitente). Afuera del baño (Luz Ámbar).","FAP (Botón de Smoke Reset se encenderá). AIP (Led color rojo intermitente). ACP (Led color azul intermitente). Afuera del baño (Luz azul).","FAP (Botón de Smoke Reset se encenderá). AIP (Led color rojo intermitente). ACP (Led color roja intermitente). Afuera del baño (Luz roja)."],"answer":"FAP (Botón de Smoke Reset se encenderá). AIP (Led color rojo intermitente). ACP (Led color ámbar intermitente). Afuera del baño (Luz Ámbar)."},{"id":41,"type":"mcq","question":"¿De dónde se apaga la alarma auditiva en caso de humo en el sanitario?","options":["Desde cabina de pilotos, interruptor de luces.","Desde el ACP, botón de llamada.","Desde el FAP y AAP, botón de Smoke Reset.","Desde el panel del sanitario, botón de prueba."],"answer":"Desde el FAP y AAP, botón de Smoke Reset."},{"id":42,"type":"mcq","question":"Cuando se activa el detector de humo en el sanitario, ¿Cómo aparece en el ACP?","options":["Luz color verde intermitente.","Luz color ámbar intermitente.","Luz color azul intermitente.","Luz color roja intermitente."],"answer":"Luz color ámbar intermitente."},{"id":43,"type":"mcq","question":"Si el ACP se ilumina de color amarillo, ¿Qué significa?","options":["Llamada del capitán o sobrecargo.","Llamada desde un baño.","Llamada de Emergencia.","Azul/Verde."],"answer":"Llamada desde un baño."},{"id":44,"type":"mcq","question":"¿Las puertas del avión A320 son abiertas por?","options":["Dentro y también por fuera.","Únicamente desde el interior.","Solamente desde cabina de pilotos.","Únicamente desde el exterior."],"answer":"Dentro y también por fuera."},{"id":45,"type":"mcq","question":"Son tres componentes de la puerta del avión A320:","options":["Mascarilla de desconexión rápida(quick donning), Extintor de Halón, Hacha, Salva vidas, Linterna, Guantes de asbesto, PBE.","Palanca de apertura, Mirilla, Manija de sujeción, Pin de seguridad, Compartimento de resguardo de tobogán.","Tobogán balsa y rampa, o, Tobogán dispositivo de flotación y Tobogán rampa.","Lavatory Service Unit. Toma corriente, una unidad de luces de: “Return to your seat” y un botón de llamada a sobrecargos."],"answer":"Palanca de apertura, Mirilla, Manija de sujeción, Pin de seguridad, Compartimento de resguardo de tobogán."},{"id":46,"type":"mcq","question":"¿Cuántas  se deben realizar en el tratamiento de quemaduras:","options":["Administración y uso efectivo de los recursos disponibles, equipos, procedimientos y personas, a fin de lograr operaciones de vuelo seguras y eficaces.","Es la parte de la mecánica de fluidos que estudia los gases en movimiento y las fuerzas o reacciones a las que están sometidos los cuerpos que se hallan en su seno.","Puertas y toboganes, iluminación de cabina de pasajeros, sistema de detección de humo (Smoke Reset), agua potable y desperdicio, temperatura de cabina, audio.","-Apagar a una persona con un extintor ya que su contenido es altamente toxico. -Romper ampollas para evitar infecciones y mayor trauma. -Aplicar remedios caseros: Ungüentos, polvos, pasta dental, alimentos, etc. -Ejercer presión directa sobre una quemadura, salvo que la hemorragia sea profusa. -No arrancar ropa ni objetos adheridos a la piel. -Mojar demasiado al lesionado, mantenga temperatura corporal."],"answer":"-Apagar a una persona con un extintor ya que su contenido es altamente toxico. -Romper ampollas para evitar infecciones y mayor trauma. -Aplicar remedios caseros: Ungüentos, polvos, pasta dental, alimentos, etc. -Ejercer presión directa sobre una quemadura, salvo que la hemorragia sea profusa. -No arrancar ropa ni objetos adheridos a la piel. -Mojar demasiado al lesionado, mantenga temperatura corporal."},{"id":180,"type":"mcq","question":"Se utiliza en caso de que un pasajero tenga alguna secreción (vómito, diarrea, etc.):","options":["Posición de recuperación.","Posición fetal.","Posición de Trendelenburg.","Posición sentada."],"answer":"Posición de recuperación."},{"id":181,"type":"tf","question":"La pérdida del conocimiento breve (o desmayo) suele ser causada por deshidratación, glucemia baja o hipotensión temporal, ¿Falso o Verdadero?","options":["Verdadero","Falso"],"answer":"Verdadero"},{"id":182,"type":"order","question":"Para evaluar el estado de consciencia de un pasajero, ¿Qué debes hacer?","steps":["Asegurar la escena.","Usar equipo de protección personal.","Evaluar la respuesta verbal.","Activar el sistema médico de emergencia.","Comprobar el pulso durante un máximo de 10 segundos.","Abrir la vía aérea y comprobar la respiración.","Comprobar reflejos.","Examinar de pies a cabeza y trasladar si es necesario."]},{"id":183,"type":"tf","question":"La hipoxia se refiere a una disminución en la cantidad de oxígeno en las células de un organismo. ¿Falso o Verdadero?","options":["Verdadero","Falso"],"answer":"Verdadero"},{"id":184,"type":"order","question":"Pasos para dar el tratamiento de SHOCK:","steps":["Colocar las piernas ligeramente elevadas, aproximadamente a 45 grados.","Cubrir a la persona con una manta.","Abrir la vía aérea.","Suministrar oxígeno."]},{"id":185,"type":"mcq","question":"Significado del acróstico SAMPLE:","options":["Signos y síntomas, alergias, medicamentos, patologías, última comida y eventos recientes.","Signos, antecedentes, masaje, posición, líquidos y emergencia.","Síntomas, aire, respiración, circulación, medicamentos y evacuación.","Seguridad, atención, movilidad, pulso, lesiones y evaluación."],"answer":"Signos y síntomas, alergias, medicamentos, patologías, última comida y eventos recientes."},{"id":186,"type":"mcq","question":"Definición de AERODINAMICA:","options":["Son aquellas que modifican la sustentación del avión.","Son aquellas que dan el control de la aeronave al piloto.","Es la parte de la mecánica de fluidos que estudia los gases en movimiento y las fuerzas o reacciones a las que están sometidos los cuerpos que se hallan en su seno.","Donde aumenta la rapidez de un fluido su presión disminuye."],"answer":"Es la parte de la mecánica de fluidos que estudia los gases en movimiento y las fuerzas o reacciones a las que están sometidos los cuerpos que se hallan en su seno."},{"id":187,"type":"mcq","question":"Explica el teorema de Bernoulli:","options":["La presión disminuye únicamente cuando aumenta la temperatura.","Donde aumenta la r in intervenir."],"answer":"Iniciar RCP."},{"id":346,"type":"mcq","question":"¿Qué significan las siglas RCP?","options":["Reanimación cardiopulmonar.","Respiración controlada pulmonar.","Revisión circulatoria primaria.","Recuperación cardiaca progresiva."],"answer":"Reanimación cardiopulmonar."},{"id":347,"type":"mcq","question":"¿Cuál es la secuencia indicada en la guía para realizar RCP?","options":["30 compresiones y 2 ventilaciones durante 5 ciclos.","15 compresiones y 1 ventilación durante 3 ciclos.","20 compresiones y 5 ventilaciones durante 2 ciclos.","10 compresiones y 2 ventilaciones durante 10 ciclos."],"answer":"30 compresiones y 2 ventilaciones durante 5 ciclos."},{"id":348,"type":"mcq","question":"Según la guía, ¿en cuáles situaciones se debe suspender la RCP?","options":["Cuando no hay quien releve y el rescatista está sumamente agotado; llega personal médico o paramédico identificado; comienza una etapa crítica del vuelo; o un médico declara el fallecimiento.","Cuando el avión entra en crucero o termina el servicio a bordo.","Cuando el paciente abre los ojos durante unos segundos o llega un familiar.","Después de cinco minutos, aunque no haya llegado personal médico."],"answer":"Cuando no hay quien releve y el rescatista está sumamente agotado; llega personal médico o paramédico identificado; comienza una etapa crítica del vuelo; o un médico declara el fallecimiento."},{"id":349,"type":"mcq","question":"¿Qué es el atragantamiento?","options":["El bloqueo de las vías respiratorias causado por la lengua o por un objeto extraño.","Una reacción alérgica leve sin obstrucción respiratoria.","La pérdida temporal de la audición.","Un dolor muscular producido por esfuerzo."],"answer":"El bloqueo de las vías respiratorias causado por la lengua o por un objeto extraño."},{"id":350,"type":"mcq","question":"¿Cuál es el tratamiento indicado en la guía para una fractura, luxación o esguince?","options":["Cohibir hemorragias, inmovilizar, verificar el pulso, movilizar solo si es necesario y trasladar en una posición adecuada.","Masajear la zona, aplicar calor directo y pedir al paciente que camine.","Enderezar el hueso, retirar la férula y movilizar de inmediato.","Mover repetidamente la articulación y aplicar presión sobre la lesión."],"answer":"Cohibir hemorragias, inmovilizar, verificar el pulso, movilizar solo si es necesario y trasladar en una posición adecuada."},{"id":351,"type":"tf","question":"Es necesario avisar al capitán de la aeronave que proporcionaremos primeros auxilios a un pasajero. ¿Verdadero o falso?","options":["Falso.","Verdadero."],"answer":"Verdadero."},{"id":352,"type":"mcq","question":"¿Qué es la hipoxia?","options":["La disminución de oxígeno en las células y tejidos del organismo.","El aumento de la temperatura corporal.","La disminución del ritmo digestivo.","El exceso de glucosa en la sangre."],"answer":"La disminución de oxígeno en las células y tejidos del organismo."},{"id":353,"type":"mcq","question":"¿Qué significan las siglas DAE?","options":["Desfibrilador automático externo.","Descompresor asistido externo.","Detector automático de energía.","Dispositivo aéreo de emergencia."],"answer":"Desfibrilador automático externo."},{"id":354,"type":"mcq","question":"¿En qué momento se utiliza un DAE durante la RCP?","options":["Cuando la persona no responde y no respira, o presenta signos de paro cardiaco súbito.","Cuando el paciente está consciente y puede hablar.","Cuando existe una hemorragia externa.","Únicamente después del aterrizaje."],"answer":"Cuando la persona no responde y no respira, o presenta signos de paro cardiaco súbito."},{"id":355,"type":"mcq","question":"Una persona se pone de pie bruscamente, no puede toser ni respirar y muestra signos de atragantamiento. ¿Qué procedimiento indica la guía?","options":["Aplicar la maniobra de Heimlich.","Darle agua inmediatamente.","Acostarla boca arriba sin intervenir.","Aplicar compresas frías en el cuello."],"answer":"Aplicar la maniobra de Heimlich."},{"id":356,"type":"mcq","question":"¿Cuándo ocurre una convulsión?","options":["Cuando aparece súbitamente una actividad eléctrica anormal en el cerebro.","Cuando disminuye la temperatura de la piel.","Cuando se bloquea parcialmente una articulación.","Cuando aumenta la presión en los oídos."],"answer":"Cuando aparece súbitamente una actividad eléctrica anormal en el cerebro."},{"id":357,"type":"mcq","question":"¿Qué es el envenenamiento?","options":["El efecto perjudicial producido cuando una sustancia tóxica se ingiere, se inhala o entra en contacto con la piel, los ojos, la boca o la nariz.","Una pérdida de conciencia producida por el ruido.","Una reacción normal del organismo ante el ejercicio.","Una lesión causada únicamente por alimentos calientes."],"answer":"El efecto perjudicial producido cuando una sustancia tóxica se ingiere, se inhala o entra en contacto con la piel, los ojos, la boca o la nariz."},{"id":358,"type":"mcq","question":"Las hemorragias, según su origen, se clasifican en:","options":["Arteriales, venosas y capilares.","Internas, externas y mixtas.","Leves, moderadas y graves.","Nasales, pulmonares y digestivas."],"answer":"Arteriales, venosas y capilares."},{"id":359,"type":"mcq","question":"Según la guía, ¿cuál es la atención de primeros auxilios ante una hemorragia visible?","options":["Limpiar con una primera gasa para identificar el origen, aplicar presión, elevar la extremidad y usar crioterapia alrededor de la lesión.","Aplicar hielo directamente dentro de la herida y mover la extremidad.","Retirar los coágulos, aplicar calor y bajar la extremidad.","Masajear la herida, retirar el vendaje y dar líquidos."],"answer":"Limpiar con una primera gasa para identificar el origen, aplicar presión, elevar la extremidad y usar crioterapia alrededor de la lesión."},{"id":360,"type":"mcq","question":"¿Cómo se identifica una quemadura de segundo grado?","options":["Afecta la segunda capa de la piel, causa dolor y produce ampollas cerradas o abiertas.","Afecta únicamente la capa superficial y no produce ampollas.","Solo produce comezón sin cambios visibles en la piel.","Destruye todos los tejidos y siempre es indolora."],"answer":"Afecta la segunda capa de la piel, causa dolor y produce ampollas cerradas o abiertas."}];const KEY='guia-cat-progreso-final-v1';let state={started:false,index:0,answers:{},startedAt:null,finished:false,order:[],stepOrders:{}};const app=document.getElementById('app');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.order))state={...state,...x,stepOrders:x.stepOrders||{}}}catch(e){}}function start(reset=false){if(reset||!state.order.length)state={started:true,index:0,answers:{},startedAt:Date.now(),finished:false,order:shuffle(BANK.map((_,i)=>i)),stepOrders:{}};else state.started=true;save();render()}function current(){return BANK[state.order[state.index]]}function answerReady(q){const a=state.answers[q.id];if(q.type==='order')return Array.isArray(a)&&a.length===q.steps.length&&new Set(a.map(Number)).size===q.steps.length&&a.every(x=>Number(x)>=1&&Number(x)<=q.steps.length);return !!a}function select(v){state.answers[current().id]=v;save();renderQuestion()}function setOrder(i,v){const q=current();let a=state.answers[q.id]||Array(q.steps.length).fill('');a[i]=v===''?'':Number(v);state.answers[q.id]=a;save();document.getElementById('next').disabled=!answerReady(q)}function next(){if(state.index<BANK.length-1){state.index++;save();renderQuestion();scrollTo(0,0)}else finish()}function finish(){state.finished=true;state.finishedAt=Date.now();save();renderResults()}function render(){if(state.finished)return renderResults();if(!state.started)return renderStart();renderQuestion()}function renderStart(){const saved=state.order.length&&!state.finished;app.innerHTML=`<div class="card start"><h2>Simulador de examen</h2><p>Contiene <b>${BANK.length} preguntas</b> de opción múltiple, verdadero/falso y ordenamiento de procedimientos.</p><p>No se muestra si una respuesta es correcta hasta finalizar. El progreso se guarda automáticamente en este dispositivo.</p><div class="top-actions">${saved?'<button class="primary" onclick="start(false)">Continuar examen</button>':''}<button class="primary" onclick="start(true)">${saved?'Comenzar de nuevo':'Comenzar examen'}</button></div></div>`}function renderQuestion(){const q=current(),a=state.answers[q.id];let body='';if(q.type==='mcq'||q.type==='tf'){body='<div class="options">'+q.options.map(o=>`<button class="option ${a===o?'selected':''}" onclick='select(${JSON.stringify(o)})'>${escapeHtml(o)}</button>`).join('')+'</div>'}else{const vals=state.answers[q.id]||Array(q.steps.length).fill('');if(!state.stepOrders[q.id]){state.stepOrders[q.id]=shuffle(q.steps.map((_,i)=>i));save()}body=`<p class="hint">Escribe del 1 al ${q.steps.length} para ordenar el procedimiento. Cada número debe usarse una sola vez.</p>`+state.stepOrders[q.id].map(idx=>`<div class="order-row"><input aria-label="Orden del paso" inputmode="numeric" min="1" max="${q.steps.length}" type="number" value="${vals[idx]||''}" oninput="setOrder(${idx},this.value)"><span>${escapeHtml(q.steps[idx])}</span></div>`).join('')}app.innerHTML=`<div class="card"><p class="q">${escapeHtml(q.question)}</p>${body}<div class="counter">${state.index+1} / ${BANK.length}</div><button id="next" class="next" onclick="next()" ${answerReady(q)?'':'disabled'}>${state.index===BANK.length-1?'Finalizar':'Siguiente'}</button></div>`}function grade(q,a){if(q.type==='order')return q.steps.every((_,i)=>Number(a?.[i])===i+1);return a===q.answer}function renderResults(){let correct=0,wrong=[];for(const q of BANK){const a=state.answers[q.id];if(grade(q,a))correct++;else wrong.push({q,a})}const pct=Math.round(correct/BANK.length*100);const elapsed=Math.max(0,((state.finishedAt||Date.now())-(state.startedAt||Date.now())));const mins=Math.floor(elapsed/60000),secs=Math.floor((elapsed%60000)/1000);app.innerHTML=`<div class="results"><div class="card"><h2>Resultado final</h2><div class="score">${pct}%</div><div class="stats"><div class="stat"><b>${correct}</b>Correctas</div><div class="stat"><b>${BANK.length-correct}</b>Incorrectas</div><div class="stat"><b>${mins}:${String(secs).padStart(2,'0')}</b>Tiempo</div></div><button class="primary" onclick="start(true)">Reintentar examen</button></div><h2>Revisión de errores</h2>${wrong.length?wrong.map(renderReview).join(''):'<div class="card"><b>¡Todas tus respuestas fueron correctas!</b></div>'}</div>`}function renderReview(x){const q=x.q,a=x.a;if(q.type==='order'){const rows=q.steps.map((step,i)=>`<tr><td>${escapeHtml(step)}</td><td>${escapeHtml(a?.[i]||'—')}</td><td>${i+1}</td></tr>`).join('');return `<div class="review-item"><h3>${escapeHtml(q.question)}</h3><div class="table-wrap"><table class="review-table"><thead><tr><th>Acción</th><th>Tu número</th><th>Número correcto</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}const yours=escapeHtml(a||'Sin respuesta'),correct=escapeHtml(q.answer);return `<div class="review-item"><h3>${escapeHtml(q.question)}</h3><div><span class="label wrong">Tu respuesta:</span><br>${yours}</div><br><div><span class="label correct">Respuesta correcta:</span><br>${correct}</div></div>`}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();render();
</script></body></html>
